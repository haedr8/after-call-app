name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Decode signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: haulni-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: haulni-aab-for-google-play
          path: app/build/outputs/bundle/release/*.aab
