name: Build Play

on:
  push:
    branches: [ play-store, play-dialer ]
  workflow_dispatch:

concurrency:
  group: build-play
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Compute version number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh release list --limit 300 | wc -l)
          echo "name=$((N+1))" >> "$GITHUB_OUTPUT"

      - name: Download Arabic OCR model (bundled into the app, runs offline)
        run: |
          mkdir -p app/src/main/assets/tessdata
          for i in 1 2 3; do
            curl -fL --retry 3 -o app/src/main/assets/tessdata/ara.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata && break
            echo "retry $i"; sleep 5
          done
          ls -l app/src/main/assets/tessdata/
          test -s app/src/main/assets/tessdata/ara.traineddata

      - name: Decode signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Verify no INTERNET permission in merged manifest
        run: |
          M=$(find app/build/intermediates -path '*merged_manifest*' -path '*elease*' -name AndroidManifest.xml | head -1)
          echo "manifest: $M"
          if [ -n "$M" ] && grep -q "android.permission.INTERNET" "$M"; then echo "INTERNET permission leaked into manifest"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: haulni-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: haulni-aab-for-google-play
          path: app/build/outputs/bundle/release/*.aab
